services:
  erpnext:
    image: ghcr.io/daemonless/erpnext:build
    network_mode: host
    environment:
      SITE_NAME: erpnext.localhost
      DB_HOST: 127.0.0.1
      DB_ROOT_PASSWORD: citroot
      ADMIN_PASSWORD: citadmin
      REDIS_CACHE: redis://127.0.0.1:6379/0
      REDIS_QUEUE: redis://127.0.0.1:6379/1

  mariadb:
    image: ghcr.io/daemonless/mariadb:11.4
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: citroot

  redis:
    image: ghcr.io/daemonless/redis:latest
    network_mode: host
