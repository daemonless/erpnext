worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    # frappe serves large reports and file downloads through gunicorn.
    proxy_read_timeout 120s;
    proxy_buffering off;

    upstream frappe_web { server 127.0.0.1:8000 fail_timeout=0; }
    upstream frappe_io  { server 127.0.0.1:9000 fail_timeout=0; }

    server {
        listen 8080;
        root /app/frappe-bench/sites;

        location /assets/ { try_files $uri =404; }

        location /socket.io {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Frappe-Site-Name __SITE_NAME__;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_pass http://frappe_io;
        }

        location / {
            # frappe resolves the site from this header, not the URL path.
            proxy_set_header X-Frappe-Site-Name __SITE_NAME__;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_pass http://frappe_web;
        }
    }
}
